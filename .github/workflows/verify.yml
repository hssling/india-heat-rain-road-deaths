name: reproduce-and-verify
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Re-run fixed-effects and Poisson-PML analyses (overwrites committed outputs)
        run: |
          python src/analysis_fe.py
          python src/robust_ppml.py
      - name: Verify every reported number
        run: python verify.py
